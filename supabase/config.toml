project_id = "stinkin-badges"

[auth]
site_url = "https://pajamastan-badge-tool.vercel.app"
additional_redirect_urls = ["https://pajamastan-badge-tool.vercel.app"]

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your badge tool login code"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Your badge tool login code"
content_path = "./supabase/templates/code.html"
